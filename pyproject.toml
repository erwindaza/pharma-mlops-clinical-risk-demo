[project]
name = "pharma-mlops-clinical-risk-demo"
version = "0.1.0"
description = "Interview-ready clinical risk scoring MLOps demo with FastAPI, MLflow, Docker, CI, and Terraform."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
